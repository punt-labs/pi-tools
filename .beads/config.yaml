# Issue prefix for this repository. It is also set in .beads/metadata.json;
# bd reads one `issue-prefix` key: the BD_ISSUE_PREFIX environment variable
# when set, else this value, else the metadata.json value copied in at
# startup. So this key wins for every reader (`bd create` and `bd linear
# sync --pull` alike) unless the variable overrides it, and nothing checks
# that the two files agree; keep them equal. `linear.pull_label` keeps that
# pull inside this repo's Linear issues; Linear is the tracker of record
# (see .punt-labs/punt/CLAUDE.md).
issue-prefix: pit
linear.pull_label: repo:pit

directory:
  labels:
    pi-tools: repo:pit

backup:
  enabled: false
export:
  auto: false
  git-add: false
